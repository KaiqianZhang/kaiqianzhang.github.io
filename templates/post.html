    <div class='wrap content'>
        <div class='front-matter'>
            <h1>{{ title }}</h1>
            <h4>{{ subtitle }}</h4>
            <div class='bylines'>
                <div class='byline'>
                    <h3>Published</h3>
                    <p>{{ date }}</p>
                </div>
                <div class='byline'>
                    <h3>Read time</h3>
                    <p>{{ read_time }}</p>
                </div>
                <div class='byline'>
                    <h3>Tags</h3>
                    <p>{{ tags }}</p>
                </div>
            </div>
            <div class='clear'></div>
        </div>
        <div class='article'>
{{ content }}
{{ footnotes }}
        </div>
        <div class='applause'>
            <button class='applause-btn' type='button' aria-pressed='false'
                    aria-label='Like this post'
                    title='Kept in your browser. Nothing is sent anywhere.'>
                <span class='hearts' aria-hidden='true'><i class='h h1'></i><i class='h h2'></i><i class='h h3'></i></span>
                <span class='applause-label'>like</span>
            </button>
        </div>
        <div id='more'>
            <a href='{{ base }}/blog/'>&larr; All posts</a>
        </div>
    </div>
    <script>
    (function () {
      var btn = document.querySelector('.applause-btn');
      if (!btn) return;
      var label = btn.querySelector('.applause-label');
      var key = 'liked:' + location.pathname;
      var said = 'liked';
      function paint(on, animate) {
        btn.classList.toggle('is-on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        label.textContent = on ? said : 'like';
        if (on && animate) {
          btn.classList.remove('is-popping');
          void btn.offsetWidth;
          btn.classList.add('is-popping');
        }
      }
      var stored = false;
      try { stored = localStorage.getItem(key) === '1'; } catch (e) {}
      paint(stored, false);
      btn.addEventListener('click', function () {
        var on = !btn.classList.contains('is-on');
        try { on ? localStorage.setItem(key, '1') : localStorage.removeItem(key); } catch (e) {}
        paint(on, true);
      });
    })();
    </script>
